<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geo:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fascinate+Inline&family=Geo:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <title>Document</title>
  </head>
  <body>
    <main>
      <header>Typify</header>
      <!-- <section class="sidenav">
        <ul class="nav-list">
          <li>Home</li>
          <li>History</li>
        </ul>
      </section> -->
      <section class="main-content">
        <h1 id="greetings">Welcome to Typify</h1>
        <div class="typingheader">
          <div class="selection">
            <label for="difficulty">Difficulty</label>
            <select>
              <option>Short</option>
              <option>Medium</option>
              <option>Long</option>
            </select>
          </div>
          <div class="counter">
            <label for="time">Time:</label>
            <span id="time">00:00</span>
          </div>
        </div>
        <button class="start">Start</button>
        <div class="typing-test">
          <div class="disabled"></div>
          <input
            type="text"
            autocomplete="off"
            autocorrect="off"
            id="inputfield"
          />
          <p id="origin-text"></p>
        </div>
      </section>
      <section class="history-section">
        <h2 class="historyheader">History</h2>
        <div class="history">
          <span id="nohistory">No History </span>
        </div>
      </section>
    </main>
    <div class="resultpopup">
      <div class="result">
        <div class="resultheader">
          <h2>Your Result</h2>
          <button class="close">X</button>
        </div>
        <p id="wpm">WPM: 0</p>
        <p id="accuracy">Accuracy: 0%</p>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
